
// protos/leetcoach/v1/designs.proto

syntax = "proto3";
import "google/protobuf/field_mask.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/leetcoach/protos";
package leetcoach.v1;

import "leetcoach/v1/models.proto";
import "leetcoach/v1/content.proto";
import "google/api/annotations.proto";

/**
 * Service for validating SDL code
 */
service SystemModelService {
    // Validates the syntax of the DSL code within a specific section.
  rpc ValidateDSL(ValidateDSLRequest) returns (ValidateDSLResponse) {
    option (google.api.http) = {
      post: "/api/v1/designs/{design_id}/sections/{section_id}/sdl:validate" // Define RESTful endpoint
      body: "*" // Use request body for parameters
    };
  }
}

// Represents a single validation error found in the DSL.
message ValidationError {
  int32 line = 1;     // Line number where the error occurred (1-based).
  int32 column = 2;   // Column number where the error occurred (1-based).
  string message = 3; // Description of the error.
}

// Request message for validating DSL code.
message ValidateDSLRequest {
  // The ID of the design containing the section.
  string design_id = 1;

  // The ID of the section whose DSL content needs validation.
  string section_id = 2;

  // Send the code directly to validate
  string code = 3;
}

// Response message for DSL validation.
message ValidateDSLResponse {
  // Indicates whether the DSL code is syntactically valid.
  bool is_valid = 1;
  // A list of errors found during validation. Populated only if is_valid is false.
  repeated ValidationError errors = 2;
}
